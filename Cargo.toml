[package]
name = "apex-petroapp"
version = "0.1.0"
edition = "2021"
description = "Apex PetroApp ingestion + odometer push-back microservice (consumes the shared `apex` Postgres DB used by Falcon)."

[dependencies]
actix-web = "4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "sync"] }
sqlx = { version = "0.7", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "chrono",
    "macros",
    "migrate",
    "json",
] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"
dotenvy = "0.15"
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
sentry-actix = { version = "0.49", default-features = false }
sentry-tracing = "0.49"
# Used by the observability scrubber to clean free-text error messages.
regex = "1"

[profile.release]
opt-level = 2
