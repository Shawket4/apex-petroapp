name: Build & Deploy apex-petroapp

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Never let two deploys race; cancel an in-flight run when a newer push lands.
concurrency:
  group: deploy-apex-petroapp
  cancel-in-progress: true

permissions:
  contents: read

env:
  BIN: apex-petroapp
  TARGET: x86_64-unknown-linux-musl
  DEPLOY_DIR: /opt/apex-petroapp
  SERVICE: apex-petroapp
  HEALTH_PORT: "8090"

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Static musl build → a single self-contained binary that runs on ANY Linux,
      # so we never have to match the VPS's glibc. This works precisely because the
      # service uses rustls (no OpenSSL) and talks to Postgres over TCP (no libpq,
      # no libsqlite). No Docker, no cross-compilation toolchain headaches.
      - name: Install Rust + musl target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add "${TARGET}"

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.TARGET }}

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build (release, static)
        run: cargo build --release --target "${TARGET}"

      - name: Verify the binary is static
        run: |
          BIN_PATH="target/${TARGET}/release/${BIN}"
          strip "$BIN_PATH" || true
          file "$BIN_PATH"
          # Expect: "not a dynamic executable" — proves zero runtime lib deps.
          ldd "$BIN_PATH" || true
          ls -lh "$BIN_PATH"
          cp "$BIN_PATH" "./${BIN}"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/stdin ~/.ssh/deploy_key   <<< "${{ secrets.SSH_PRIVATE_KEY }}"
          install -m 644 /dev/stdin ~/.ssh/known_hosts  <<< "${{ secrets.SSH_KNOWN_HOSTS }}"

      - name: Upload binary
        run: |
          scp -i ~/.ssh/deploy_key -P "${{ secrets.SSH_PORT }}" \
            -o BatchMode=yes \
            "./${BIN}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/${BIN}.new"

      # Optional: keep the production .env in a GitHub secret (PROD_ENV) so deploys
      # are reproducible and you never edit it on the box. If the secret is empty,
      # we leave the server's existing .env untouched.
      - name: Upload production .env (only if PROD_ENV secret is set)
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
        run: |
          if [ -n "$PROD_ENV" ]; then
            printf '%s' "$PROD_ENV" > prod.env
            scp -i ~/.ssh/deploy_key -P "${{ secrets.SSH_PORT }}" -o BatchMode=yes \
              prod.env "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/${BIN}.env.new"
            rm -f prod.env
            echo "Uploaded production .env from secret."
          else
            echo "PROD_ENV not set — server .env will be left as-is."
          fi

      - name: Deploy
        run: |
          # Remote deploy script. 'REOF' (quoted) prevents local variable expansion;
          # config is passed as a small env preamble on the ssh command line.
          cat > deploy_remote.sh <<'REOF'
          #!/usr/bin/env bash
          set -euo pipefail

          RUN_USER="apex"
          NEW_BIN="/tmp/${BIN}.new"
          NEW_ENV="/tmp/${BIN}.env.new"

          echo "==> Deploying ${SERVICE} to ${DEPLOY_DIR}"

          # Dedicated unprivileged service account.
          if ! id -u "${RUN_USER}" >/dev/null 2>&1; then
            sudo useradd --system --no-create-home --shell /usr/sbin/nologin "${RUN_USER}"
          fi

          sudo mkdir -p "${DEPLOY_DIR}" "${DEPLOY_DIR}/backups"

          # Install/refresh the systemd unit (idempotent). The binary loads
          # ${DEPLOY_DIR}/.env itself via dotenv, so WorkingDirectory is all it needs.
          sudo tee "/etc/systemd/system/${SERVICE}.service" >/dev/null <<UNIT
          [Unit]
          Description=Apex PetroApp microservice
          After=network-online.target postgresql.service
          Wants=network-online.target

          [Service]
          Type=simple
          User=${RUN_USER}
          Group=${RUN_USER}
          WorkingDirectory=${DEPLOY_DIR}
          ExecStart=${DEPLOY_DIR}/${BIN}
          Restart=on-failure
          RestartSec=5
          NoNewPrivileges=true
          ProtectSystem=full
          ProtectHome=true
          PrivateTmp=true

          [Install]
          WantedBy=multi-user.target
          UNIT

          # Stop before swapping the binary.
          sudo systemctl stop "${SERVICE}" 2>/dev/null || true

          # Back up the current binary; keep the last 5.
          if [ -f "${DEPLOY_DIR}/${BIN}" ]; then
            ts="$(date +%Y%m%d_%H%M%S)"
            sudo cp "${DEPLOY_DIR}/${BIN}" "${DEPLOY_DIR}/backups/${BIN}.${ts}"
            ls -t "${DEPLOY_DIR}/backups/${BIN}."* 2>/dev/null | tail -n +6 | xargs -r sudo rm -f
          fi

          # Install the new binary atomically.
          test -f "${NEW_BIN}"
          sudo install -m 0755 "${NEW_BIN}" "${DEPLOY_DIR}/${BIN}"
          sudo rm -f "${NEW_BIN}"

          # Production env: prefer an uploaded one; otherwise require an existing .env.
          # We never seed placeholder values that would start the service misconfigured.
          if [ -f "${NEW_ENV}" ]; then
            sudo install -m 0600 "${NEW_ENV}" "${DEPLOY_DIR}/.env"
            sudo rm -f "${NEW_ENV}"
            echo "Installed .env from PROD_ENV secret."
          elif [ ! -f "${DEPLOY_DIR}/.env" ]; then
            echo "ERROR: ${DEPLOY_DIR}/.env is missing and no PROD_ENV secret was provided."
            echo "Create it (DATABASE_URL, INTERNAL_API_KEY, WhatsApp vars, ...) and re-run."
            exit 1
          fi

          sudo chown -R "${RUN_USER}:${RUN_USER}" "${DEPLOY_DIR}"
          sudo chmod 0600 "${DEPLOY_DIR}/.env"

          sudo systemctl daemon-reload
          sudo systemctl enable "${SERVICE}" >/dev/null 2>&1 || true
          sudo systemctl restart "${SERVICE}"

          # Health gate: poll /health and FAIL the deploy if it never comes up.
          echo "==> Waiting for health on 127.0.0.1:${HEALTH_PORT}/health"
          ok=0
          for _ in $(seq 1 15); do
            if curl -sf "http://127.0.0.1:${HEALTH_PORT}/health" >/dev/null; then ok=1; break; fi
            sleep 2
          done

          if [ "$ok" = "1" ]; then
            echo "✅ ${SERVICE} is healthy"
            sudo systemctl status "${SERVICE}" --no-pager || true
          else
            echo "❌ ${SERVICE} did not become healthy — recent logs:"
            sudo journalctl -u "${SERVICE}" -n 40 --no-pager || true
            exit 1
          fi
          REOF

          scp -i ~/.ssh/deploy_key -P "${{ secrets.SSH_PORT }}" -o BatchMode=yes \
            deploy_remote.sh \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/${BIN}-deploy.sh"

          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" -o BatchMode=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "BIN='${BIN}' SERVICE='${SERVICE}' DEPLOY_DIR='${DEPLOY_DIR}' HEALTH_PORT='${HEALTH_PORT}' bash /tmp/${BIN}-deploy.sh"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
